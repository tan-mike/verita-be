[package]
name = "verita"
version = "0.1.0"
description = "Created with Anchor"
edition.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "lib"]
name = "verita"

[features]
# `demo` is ON by default: this repo's purpose is the devnet demo, and the
# `advance_clock` instruction must exist in the default build/IDL for the
# on-stage "roll time to DLP expiry" beat to work.
# Build a production artifact with: cargo/anchor build -- --no-default-features
default = ["demo"]
cpi = ["no-entrypoint"]
no-entrypoint = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]
anchor-debug = []
custom-heap = []
custom-panic = []
demo = []


[dependencies]
anchor-lang = "1.1.2"
solana-sha256-hasher = "3.1.0"

[dev-dependencies]
litesvm = "0.10.0"
solana-message = "3.0.1"
solana-transaction = "3.0.2"
solana-signer = "3.0.0"
solana-keypair = "3.0.1"


[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_os, values("solana"))'] }
